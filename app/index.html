<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1220">
<title>Mes Copies · Éco-Droit STMG</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1220; --card: rgba(255,255,255,.055); --card-strong: rgba(255,255,255,.09);
    --border: rgba(255,255,255,.12); --text: #EAEEF7; --muted: #8B93A7;
    --accent: #F2A65A; --good: #55C89B; --mid: #F2C94C; --bad: #E56B6F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 40% at 15% -5%, rgba(242,166,90,.12), transparent),
      radial-gradient(ellipse 70% 40% at 95% 105%, rgba(232,115,90,.08), transparent);
    background-attachment: fixed; color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; padding-bottom: 90px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 0; }
  header { margin-bottom: 18px; }
  .head-top { display: flex; align-items: center; justify-content: space-between; }
  .hello h1 { font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 700; }
  .hello p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .logout { background: var(--card); border: 1px solid var(--border); color: var(--muted);
    border-radius: 12px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .head-stats { display: flex; gap: 10px; margin-top: 14px; }
  .head-stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 10px; text-align: center; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .head-stat b { display: block; font-family: 'Sora', sans-serif; font-size: 20px; font-variant-numeric: tabular-nums; }
  .head-stat span { font-size: 11px; color: var(--muted); }
  .evo { font-size: 12px; font-weight: 700; margin-left: 4px; }
  .evo.up { color: var(--good); } .evo.down { color: var(--bad); }

  .glass { background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 18px; margin-bottom: 14px; }
  .section-title { font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 22px 4px 12px; }

  .copie { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .copie:active { background: var(--card-strong); }
  .copie-info { flex: 1; min-width: 0; }
  .chip { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; padding: 3px 8px; border-radius: 999px; margin: 0 6px 6px 0; }
  .chip.droit { background: rgba(122,162,247,.15); color: #9AB4FF; }
  .chip.eco { background: rgba(242,166,90,.15); color: var(--accent); }
  .chip.type { background: rgba(255,255,255,.09); color: #C6CCDD; }
  .chip.new { background: var(--good); color: #0D1220; }
  .copie-titre { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .copie-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .copie-meta b { color: var(--text); font-weight: 600; }

  .ring { position: relative; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: rgba(255,255,255,.1); }
  .ring .val { stroke-linecap: round; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .ring .num small { font-size: 9px; color: var(--muted); font-weight: 600; margin-top: -2px; }
  .ring .num > div { display: flex; flex-direction: column; align-items: center; }

  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(8,11,20,.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: flex-end; justify-content: center; }
  .modal.open { display: flex; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #141B2E;
    border: 1px solid var(--border); border-bottom: none; border-radius: 24px 24px 0 0;
    padding: 22px 20px 40px; animation: slideUp .32s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .sheet h2 { font-family: 'Sora', sans-serif; font-size: 18px; line-height: 1.35; }
  .close { background: var(--card-strong); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .stats-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat { flex: 1; text-align: center; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px 6px; }
  .stat b { display: block; font-family: 'Sora', sans-serif; font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }

  .retour { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .retour-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .retour-head b { font-size: 13.5px; }
  .retour-pts { font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cap-tags { margin-bottom: 8px; }
  .cap-tag { display: inline-block; font-size: 10px; font-weight: 600; color: #C9B2E8;
    background: rgba(155,110,220,.15); border-radius: 999px; padding: 2px 8px; margin: 0 4px 4px 0; }
  .cap-tag.trans { color: #8FD8C4; background: rgba(85,200,155,.13); }
  .bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-bottom: 10px; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .retour p { font-size: 13.5px; line-height: 1.55; color: #C6CCDD; }
  details.attendu { margin-top: 10px; background: rgba(85,200,155,.07); border: 1px solid rgba(85,200,155,.25);
    border-radius: 12px; padding: 9px 12px; }
  details.attendu summary { font-size: 12px; font-weight: 700; color: var(--good); cursor: pointer; list-style: none; }
  details.attendu summary::before { content: '▸ '; }
  details.attendu[open] summary::before { content: '▾ '; }
  details.attendu p { font-size: 12.5px; margin-top: 6px; color: #BFE9DA; }
  .pdf-link { display: block; text-align: center; margin-top: 14px; padding: 13px; background: var(--accent);
    color: #201409; border-radius: 14px; font-weight: 700; font-size: 14.5px; text-decoration: none; }

  .chart-box { padding: 18px 12px 8px; }
  .chart-box h3, .themes-box h3 { font-family: 'Sora', sans-serif; font-size: 14.5px; margin-bottom: 14px; padding-left: 6px; }
  .type-cards { display: flex; gap: 10px; margin-bottom: 14px; }
  .type-card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 11px 8px; text-align: center; }
  .type-card b { display: block; font-family: 'Sora', sans-serif; font-size: 17px; }
  .type-card span { font-size: 10.5px; color: var(--muted); display: block; line-height: 1.4; }
  .seg { display: flex; background: rgba(0,0,0,.25); border-radius: 12px; padding: 3px; margin-bottom: 6px; }
  .seg button { flex: 1; padding: 9px; border: none; border-radius: 10px; background: transparent;
    color: var(--muted); font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--card-strong); color: var(--text); }
  .mat-rang { text-align: center; font-size: 12.5px; color: var(--muted); margin: 8px 0 10px; }
  .mat-rang b { color: var(--text); font-family: 'Sora', sans-serif; }
  .theme-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .theme-item:last-child { border-bottom: none; }
  .milestone { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700; border: 2px solid var(--border);
    color: var(--muted); background: rgba(0,0,0,.2); }
  .milestone.done { border-color: var(--good); color: var(--good); }
  .milestone.mid { border-color: var(--mid); color: var(--mid); }
  .milestone.low { border-color: var(--bad); color: var(--bad); }
  .theme-item .t { font-size: 13px; line-height: 1.4; }
  .theme-item .m { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .theme-item .r { font-family: 'Sora', sans-serif; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .theme-item .r small { display: block; font-size: 9.5px; color: var(--muted); font-weight: 600; text-align: right; }

  .cap-item { padding: 11px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .cap-item:last-child { border-bottom: none; }
  .cap-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .cap-line .n { font-size: 13px; line-height: 1.4; }
  .cap-line .s { font-size: 11px; font-weight: 700; white-space: nowrap; }
  .cap-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .cap-bar i { display: block; height: 100%; border-radius: 99px; }

  .fiche { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .fiche:last-child { border-bottom: none; }
  .fiche .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    font-size: 17px; background: rgba(85,200,155,.13); flex-shrink: 0; }
  .fiche.lock .ic { background: rgba(255,255,255,.07); filter: grayscale(1); opacity: .7; }
  .fiche .t { flex: 1; font-size: 13.5px; font-weight: 600; }
  .fiche .m { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .fiche a { font-size: 12.5px; font-weight: 700; color: var(--accent); text-decoration: none;
    background: var(--card-strong); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
  .prio { border-left: 3px solid var(--bad); }
  .prio.p2 { border-left-color: var(--mid); }
  .prio h3 { font-family: 'Sora', sans-serif; font-size: 14.5px; margin-bottom: 4px; }
  .prio .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .prio-q { background: rgba(0,0,0,.22); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .prio-q b { font-size: 12.5px; display: block; margin-bottom: 3px; }
  .prio-q p { font-size: 12.5px; color: #C6CCDD; line-height: 1.5; }
  .prio-q .pts { font-size: 11px; font-weight: 700; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: rgba(13,18,32,.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 8px 0 max(10px, env(safe-area-inset-bottom)); }
  nav button { background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
    padding: 4px 10px; font-family: inherit; }
  nav button .i { font-size: 21px; }
  nav button.on { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; line-height: 1.6; }
  .page { display: none; } .page.on { display: block; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-top">
      <div class="hello"><h1 id="hello">Bonjour !</h1><p id="classe-label"></p></div>
      <button class="logout" id="logout">Changer de code</button>
    </div>
    <div class="head-stats" id="head-stats"></div>
  </header>

  <section class="page on" id="page-copies">
    <div class="section-title">Mes copies corrigées</div>
    <div id="copies-list"></div>
  </section>

  <section class="page" id="page-progression">
    <div class="section-title">Mon évolution</div>
    <div class="glass chart-box"><h3>Notes au fil de l'année</h3><div id="chart"></div></div>
    <div class="section-title">Par type d'évaluation</div>
    <div class="type-cards" id="type-cards"></div>
    <div class="section-title">Programme et classements</div>
    <div class="glass themes-box">
      <div class="seg" id="seg-mat">
        <button data-mat="droit" class="on">Droit</button>
        <button data-mat="eco">Économie</button>
      </div>
      <div class="mat-rang" id="mat-rang"></div>
      <div id="themes-list"></div>
    </div>
  </section>

  <section class="page" id="page-capacites">
    <div class="section-title">Capacités transversales — celles du bac</div>
    <div class="glass" id="caps-trans"></div>
    <div class="section-title">Capacités du programme</div>
    <div class="glass" id="caps-them"></div>
  </section>

  <section class="page" id="page-reviser">
    <div class="section-title">Mes fiches de synthèse</div>
    <div class="glass" id="fiches-list"></div>
    <div class="section-title">Tes priorités de révision</div>
    <div id="prio-list"></div>
  </section>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<nav>
  <button class="on" data-page="copies"><span class="i">📝</span>Copies</button>
  <button data-page="progression"><span class="i">📈</span>Progression</button>
  <button data-page="capacites"><span class="i">🧭</span>Capacités</button>
  <button data-page="reviser"><span class="i">🎯</span>Réviser</button>
</nav>

<script>
(async function () {
  const code = localStorage.getItem('eleve_code');
  if (!code) { location.replace('../'); return; }

  let CONF, ELEVE, REF;
  try {
    [CONF, ELEVE, REF] = await Promise.all([
      fetch('../data/devoirs.json', { cache: 'no-store' }).then(r => r.json()),
      fetch(`../data/eleves/${encodeURIComponent(code)}.json`, { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch('../data/capacites.json', { cache: 'no-store' }).then(r => r.json()),
    ]);
  } catch (e) { localStorage.removeItem('eleve_code'); location.replace('../'); return; }

  const classe = CONF.classes[ELEVE.classe] || { nom: ELEVE.classe, accent: '#F2A65A' };
  document.documentElement.style.setProperty('--accent', classe.accent);
  document.getElementById('classe-label').textContent = classe.nom + ' · Économie-Droit';

  let prenom = localStorage.getItem('prenom_local');
  if (!prenom) {
    prenom = (window.prompt('Ton prénom ? (il reste uniquement sur ton téléphone)') || '').trim();
    if (prenom) localStorage.setItem('prenom_local', prenom);
  }
  document.getElementById('hello').textContent = prenom ? `Bonjour ${prenom} !` : 'Bonjour !';
  document.getElementById('logout').onclick = () => {
    ['eleve_code', 'prenom_local', 'derniere_visite'].forEach(k => localStorage.removeItem(k));
    location.replace('../');
  };

  // ── Référentiel de capacités : index id → {titre, description, trans} ──
  const CAPS = {};
  for (const c of REF.transversales) CAPS[c.id] = { ...c, trans: true };
  const bloc = REF.thematiques[ELEVE.classe] || {};
  for (const mat of Object.values(bloc)) for (const [tid, t] of Object.entries(mat))
    for (const c of t.capacites) CAPS[c.id] = { ...c, theme: tid, trans: false };

  const devoirById = Object.fromEntries(CONF.devoirs.map(d => [d.id, d]));
  const copies = (ELEVE.copies || []).filter(c => devoirById[c.devoir_id])
    .sort((a, b) => devoirById[a.devoir_id].date < devoirById[b.devoir_id].date ? 1 : -1);
  const chapitres = (CONF.chapitres || {})[ELEVE.classe] || [];

  const TYPES = { dossier: 'Dossier', lecon: 'Contrôle de leçon', bac: 'Type bac' };
  const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const fmtNote = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR');
  const noteColor = (n, max) => { const r = n / max; return r >= .6 ? 'var(--good)' : r >= .4 ? 'var(--mid)' : 'var(--bad)'; };
  const ordinal = n => n === 1 ? '1<sup>er</sup>' : n + '<sup>e</sup>';

  const derniereVisite = localStorage.getItem('derniere_visite') || '';
  const estNouvelle = c => c.publie_le && c.publie_le > derniereVisite;
  localStorage.setItem('derniere_visite', new Date().toISOString().slice(0, 10));

  // ── En-tête ──
  const general = (ELEVE.classements || {}).general;
  const hs = document.getElementById('head-stats');
  if (general) {
    let evo = '';
    if (general.rang_precedent && general.rang_precedent !== general.rang) {
      const g = general.rang_precedent - general.rang;
      evo = g > 0 ? `<span class="evo up">▲ +${g}</span>` : `<span class="evo down">▼ ${g}</span>`;
    }
    hs.innerHTML = `
      <div class="head-stat"><b>${fmtNote(general.moyenne)}</b><span>Moyenne générale /20 (coef inclus)</span></div>
      <div class="head-stat"><b>${ordinal(general.rang)} <small style="font-size:12px;color:var(--muted)">/ ${general.effectif}</small>${evo}</b><span>Classement général</span></div>`;
  } else {
    hs.innerHTML = `<div class="head-stat"><b>—</b><span>Ta moyenne et ton classement apparaîtront après ta première copie</span></div>`;
  }

  function ringHTML(note, max, size = 62) {
    const r = (size - 6) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(note / max, 1));
    return `<div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}">
        <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
        <circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${noteColor(note, max)}"
          stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
      </svg>
      <div class="num"><div>${fmtNote(note)}<small>/ ${max}</small></div></div></div>`;
  }

  // ── Copies ──
  const list = document.getElementById('copies-list');
  if (!copies.length) {
    list.innerHTML = `<div class="glass empty">Aucune copie corrigée pour l'instant.<br>Elles apparaîtront ici dès que ton professeur aura terminé les corrections. 📬</div>`;
  } else {
    list.innerHTML = copies.map((c, i) => {
      const d = devoirById[c.devoir_id];
      const rang = c.rang ? ` · <b>${c.rang === 1 ? '1er' : c.rang + 'e'} / ${c.effectif}</b>` : '';
      return `<div class="glass copie" data-i="${i}" role="button" tabindex="0" aria-label="Ouvrir ${d.titre}">
        <div class="copie-info">
          <span class="chip ${d.matiere}">${d.matiere === 'droit' ? 'Droit' : 'Économie'}</span><span class="chip type">${TYPES[d.type] || ''} · coef ${d.coef}</span>${estNouvelle(c) ? '<span class="chip new">Nouveau</span>' : ''}
          <div class="copie-titre">${d.titre}</div>
          <div class="copie-meta">${fmtDate(d.date)}${rang}</div>
        </div>${ringHTML(c.note, d.note_max)}</div>`;
    }).join('');
  }

  const modal = document.getElementById('modal'), sheet = document.getElementById('sheet');
  function capTags(r) {
    let h = '';
    if (r.capacite && CAPS[r.capacite]) h += `<span class="cap-tag">${CAPS[r.capacite].titre}</span>`;
    for (const t of (r.transversales || [])) if (CAPS[t]) h += `<span class="cap-tag trans">${CAPS[t].titre}</span>`;
    return h ? `<div class="cap-tags">${h}</div>` : '';
  }
  function openCopie(i) {
    const c = copies[i], d = devoirById[c.devoir_id];
    const retours = (c.retours || []).map(r => `
      <div class="retour">
        <div class="retour-head"><b>${r.question} — ${r.intitule}</b>
          <span class="retour-pts" style="color:${noteColor(r.points, r.points_max)}">${fmtNote(r.points)} / ${fmtNote(r.points_max)}</span></div>
        ${capTags(r)}
        <div class="bar"><i style="width:${Math.min(r.points / r.points_max * 100, 100)}%;background:${noteColor(r.points, r.points_max)}"></i></div>
        <p>${r.commentaire}</p>
        ${r.reponse_attendue ? `<details class="attendu"><summary>Voir la réponse attendue</summary><p>${r.reponse_attendue}</p></details>` : ''}
      </div>`).join('');
    sheet.innerHTML = `
      <div class="sheet-head"><div>
        <span class="chip ${d.matiere}">${d.matiere === 'droit' ? 'Droit' : 'Économie'}</span><span class="chip type">${TYPES[d.type] || ''} · coef ${d.coef}</span>
        <h2>${d.titre}</h2></div><button class="close" aria-label="Fermer">✕</button></div>
      <div class="stats-row">
        <div class="stat"><b style="color:${noteColor(c.note, d.note_max)}">${fmtNote(c.note)}</b><span>Ta note / ${d.note_max}</span></div>
        ${c.rang != null ? `<div class="stat"><b>${ordinal(c.rang)}</b><span>sur ${c.effectif} élèves</span></div>` : ''}
        ${c.moyenne_classe != null ? `<div class="stat"><b>${fmtNote(c.moyenne_classe)}</b><span>Moyenne classe</span></div>` : ''}
      </div>
      ${retours || '<div class="empty">Retour détaillé bientôt disponible.</div>'}
      ${c.pdf ? `<a class="pdf-link" href="../${c.pdf}" target="_blank" rel="noopener">📄 Voir ma copie annotée (PDF)</a>` : ''}`;
    modal.classList.add('open');
    sheet.querySelector('.close').onclick = () => modal.classList.remove('open');
  }
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  list.addEventListener('click', e => { const el = e.target.closest('.copie'); if (el) openCopie(+el.dataset.i); });
  list.addEventListener('keydown', e => { const el = e.target.closest('.copie'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCopie(+el.dataset.i); } });

  // ── Progression ──
  (function drawChart() {
    const box = document.getElementById('chart');
    const pts = [...copies].reverse().map(c => ({ n: c.note, m: devoirById[c.devoir_id].note_max, moy: c.moyenne_classe }));
    if (pts.length < 2) { box.innerHTML = `<div class="empty">Le graphique apparaîtra à partir de ta deuxième copie. 📈</div>`; return; }
    const W = 480, H = 190, P = 30;
    const x = i => P + i * (W - 2 * P) / (pts.length - 1);
    const y = v => H - P - v / 20 * (H - 2 * P);
    const line = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
    const notes = pts.map(p => p.n * 20 / p.m);
    const moys = pts.map(p => p.moy != null ? p.moy * 20 / p.m : null);
    const hasMoy = moys.every(v => v != null);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution de tes notes">
      ${[5,10,15,20].map(v => `<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/>
        <text x="${P-8}" y="${y(v)+4}" fill="#8B93A7" font-size="10" text-anchor="end">${v}</text>`).join('')}
      ${hasMoy ? `<path d="${line(moys)}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-dasharray="5 5"/>` : ''}
      <path d="${line(notes)}" fill="none" stroke="${classe.accent}" stroke-width="3" stroke-linecap="round"/>
      ${notes.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${classe.accent}"/>
        <text x="${x(i)}" y="${y(v)-11}" fill="#EAEEF7" font-size="11" font-weight="700" text-anchor="middle">${fmtNote(Math.round(v*10)/10)}</text>`).join('')}
    </svg>
    ${hasMoy ? `<p style="font-size:11px;color:var(--muted);text-align:center;padding-bottom:8px">— Toi &nbsp; ┄ Moyenne de la classe &nbsp;(notes /20)</p>` : ''}`;
  })();

  const types = (ELEVE.classements || {}).types || {};
  document.getElementById('type-cards').innerHTML = ['dossier', 'lecon', 'bac'].map(t => {
    const b = types[t];
    return `<div class="type-card">${b
      ? `<b style="color:${noteColor(b.moyenne, 20)}">${fmtNote(b.moyenne)}</b><span>${TYPES[t]}</span><span>${b.rang === 1 ? '1er' : b.rang + 'e'} / ${b.effectif}</span>`
      : `<b style="color:var(--muted)">—</b><span>${TYPES[t]}</span><span>pas encore évalué</span>`}</div>`;
  }).join('');

  const clsm = ELEVE.classements || {};
  function renderThemes(mat) {
    const b = (clsm.matieres || {})[mat];
    document.getElementById('mat-rang').innerHTML = b
      ? `En ${mat === 'droit' ? 'Droit' : 'Économie'}, tu es <b>${ordinal(b.rang)} / ${b.effectif}</b> avec <b>${fmtNote(b.moyenne)}/20</b> de moyenne`
      : `Pas encore de copie en ${mat === 'droit' ? 'Droit' : 'Économie'}`;
    const themes = (CONF.programme[ELEVE.classe] || {})[mat] || [];
    document.getElementById('themes-list').innerHTML = themes.map((t, idx) => {
      const cs = copies.filter(c => { const d = devoirById[c.devoir_id]; return d.matiere === mat && d.theme === t.id; });
      const rt = (clsm.themes || {})[t.id];
      let cls = '', label = 'Pas encore évalué', inner = idx + 1;
      if (cs.length) {
        const avg = rt ? rt.moyenne : cs.reduce((s, c) => s + c.note * 20 / devoirById[c.devoir_id].note_max, 0) / cs.length;
        cls = avg >= 12 ? 'done' : avg >= 8 ? 'mid' : 'low';
        label = `${cs.length} copie${cs.length > 1 ? 's' : ''} · moyenne ${fmtNote(Math.round(avg*10)/10)}/20`;
        if (cls === 'done') inner = '✓';
      }
      return `<div class="theme-item"><div class="milestone ${cls}">${inner}</div>
        <div style="flex:1"><div class="t">${t.titre}</div><div class="m">${label}</div></div>
        ${rt ? `<div class="r">${ordinal(rt.rang)} / ${rt.effectif}<small>sur ce thème</small></div>` : ''}</div>`;
    }).join('');
  }
  renderThemes('droit');
  document.querySelectorAll('#seg-mat button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#seg-mat button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); renderThemes(b.dataset.mat);
  });

  // ── Capacités ──
  const cumul = ELEVE.capacites || {};
  function statut(pts, max) {
    if (max < 2) return { label: 'En observation', col: 'var(--muted)', ratio: max ? pts / max : 0 };
    const r = pts / max;
    if (r >= .65) return { label: 'Acquise', col: 'var(--good)', ratio: r };
    if (r >= .45) return { label: 'En cours', col: 'var(--mid)', ratio: r };
    return { label: 'Fragile', col: 'var(--bad)', ratio: r };
  }
  function capHTML(cid) {
    const c = cumul[cid], info = CAPS[cid];
    if (!info) return '';
    const s = statut(c.pts, c.max);
    return `<div class="cap-item">
      <div class="cap-line"><span class="n">${info.titre}</span>
        <span class="s" style="color:${s.col}">${s.label} · ${Math.round(s.ratio * 100)}%</span></div>
      <div class="cap-bar"><i style="width:${Math.round(s.ratio * 100)}%;background:${s.col}"></i></div>
    </div>`;
  }
  const transEval = REF.transversales.filter(t => cumul[t.id]);
  document.getElementById('caps-trans').innerHTML = transEval.length
    ? transEval.map(t => capHTML(t.id)).join('')
    : `<div class="empty">Tes capacités apparaîtront après ta première copie corrigée.</div>`;
  const themEval = Object.keys(cumul).filter(id => CAPS[id] && !CAPS[id].trans);
  if (themEval.length) {
    const parTheme = {};
    for (const id of themEval) (parTheme[CAPS[id].theme] ||= []).push(id);
    const titres = {};
    for (const mat of Object.values(bloc)) for (const [tid, t] of Object.entries(mat)) titres[tid] = t.titre;
    document.getElementById('caps-them').innerHTML = Object.entries(parTheme).map(([tid, ids]) =>
      `<div class="section-title" style="margin:8px 0 4px">${titres[tid] || tid}</div>` + ids.map(capHTML).join('')
    ).join('');
  } else {
    document.getElementById('caps-them').innerHTML = `<div class="empty">Les capacités du programme apparaîtront au fil des chapitres.</div>`;
  }

  // ── Réviser : fiches + priorités ──
  const fl = document.getElementById('fiches-list');
  fl.innerHTML = chapitres.length ? chapitres.map(ch => {
    if (ch.fiche_visible) {
      return `<div class="fiche"><div class="ic">📖</div>
        <div class="t">${ch.titre}<div class="m">Fiche débloquée — à apprendre pour le contrôle de leçon</div></div>
        ${ch.fiche ? `<a href="${ch.fiche}" target="_blank" rel="noopener">Réviser</a>` : `<span style="font-size:11.5px;color:var(--muted)">bientôt en ligne</span>`}</div>`;
    }
    return `<div class="fiche lock"><div class="ic">🔒</div>
      <div class="t" style="color:var(--muted)">${ch.titre}<div class="m">Se débloque après le chapitre</div></div></div>`;
  }).join('') : `<div class="empty">Les fiches apparaîtront au fil des chapitres.</div>`;

  (function renderPriorites() {
    const el = document.getElementById('prio-list');
    const faibles = Object.entries(cumul)
      .filter(([id, v]) => CAPS[id] && v.max >= 2 && v.pts / v.max < .6)
      .sort((a, b) => a[1].pts / a[1].max - b[1].pts / b[1].max).slice(0, 3);
    if (!copies.length) { el.innerHTML = `<div class="glass empty">Tes priorités apparaîtront après ta première copie corrigée.</div>`; return; }
    if (!faibles.length) { el.innerHTML = `<div class="glass empty">Aucune capacité en difficulté : continue comme ça ! 💪</div>`; return; }
    el.innerHTML = faibles.map(([cid, v], i) => {
      const info = CAPS[cid];
      const questions = [];
      for (const c of copies) for (const r of (c.retours || []))
        if ((r.capacite === cid || (r.transversales || []).includes(cid)) && r.points / r.points_max < .5)
          questions.push({ ...r, devoir: devoirById[c.devoir_id].titre, ratio: r.points / r.points_max });
      const pires = questions.sort((a, b) => a.ratio - b.ratio).slice(0, 2);
      const chVis = info.theme ? chapitres.find(ch => ch.theme === info.theme && ch.fiche_visible && ch.fiche) : null;
      return `<div class="glass prio ${i > 0 ? 'p2' : ''}">
        <h3>${info.titre}</h3>
        <div class="sub">${Math.round(v.pts / v.max * 100)}% des points obtenus sur cette capacité · à retravailler en priorité</div>
        ${pires.map(q => `<div class="prio-q"><b>${q.question} — ${q.intitule}
          <span class="pts" style="color:${noteColor(q.points, q.points_max)}">(${fmtNote(q.points)}/${fmtNote(q.points_max)})</span></b>
          <p>${q.commentaire}</p></div>`).join('')}
        ${chVis ? `<div class="fiche" style="border:none;padding:6px 0 0"><a href="${chVis.fiche}" target="_blank" rel="noopener">📖 Réviser la fiche « ${chVis.titre} »</a></div>` : ''}
      </div>`;
    }).join('');
  })();

  // ── Navigation ──
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('page-' + b.dataset.page).classList.add('on');
    window.scrollTo({ top: 0 });
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');
})();
</script>
</body>
</html>
